name: mmir
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults
dependencies:
  - python=3.12
  - numpy=1.26
  - scipy
  - matplotlib
  - scikit-image
  - scikit-learn
  - pandas
  - seaborn
  - tqdm
  - pyyaml
  - pillow
  - pytest
  - ipykernel
  - ipywidgets

  # CUDA / PyTorch (adjust cuda version to match your system)
  - pytorch::pytorch>=2.1.0
  - pytorch::torchvision>=0.16.0
  - pytorch::torchaudio>=2.1.0
  - nvidia::cuda-cudart

  # FAISS (optional, for nearest-neighbor search in alignment)
  - pytorch::faiss-gpu

  # Pip-only packages
  - pip
  - pip:
      - drjit==1.2.0
      - mitsuba==3.7.1
      - open3d>=0.17.0
      - trimesh>=4.0.0
      - slangtorch>=1.3.0
      - plotly>=5.0.0
